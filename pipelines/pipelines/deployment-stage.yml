parameters:
- name: name
- name: displayName
- name: dependsOn
- name: jobName
- name: jobDisplayName
- name: envName
- name: vmImageName
- name: variableFile
- name: azureSubscriptionName
- name: azureSubscriptionId


jobs:
- deployment: ${{parameters.jobName}}
  displayName: ${{parameters.jobDisplayName}}
  environment: ${{parameters.envName}}

  variables:
  - template: ${{parameters.variableFile}}
  pool:
    vmImage: ${{parameters.vmImageName}}

  strategy:
    runOnce:
      deploy:
        steps:
        
        - task: DownloadPipelineArtifact@2
          displayName: 'Download Files'
          inputs:
            artifact: drop
            downloadPath: '$(System.ArtifactsDirectory)\files'

        - task: AzureRmWebAppDeployment@4
          displayName: 'Azure App Service Deploy: $(appServiceName1)'
          inputs:
            azureSubscription: 's192d.azdo-deployment'
            WebAppName: '$(appServiceName1)'
            packageForLinux: '$(System.ArtifactsDirectory)\files\**\ASP.Web.zip'
