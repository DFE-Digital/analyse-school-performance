trigger:
  branches:
    include:
    - main
      
variables:
  - template: pipelines/variables/common-var.yml
 
stages:
- stage: Build
  displayName: Build stage

  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)

    steps:
      - task: NuGetToolInstaller@1

      - task: NuGetCommand@2
        displayName: 'NuGet restore'
        inputs:
          restoreSolution: '**\*.sln'

      - task: Npm@1
        displayName: 'Install Node Packages'
        inputs:
          command: 'install' 
          workingDir: '$(Build.SourcesDirectory)/src/asp.web'
          verbose: true
          
      - task: Npm@1
        displayName: 'Run Webpack'
        inputs:
          command: 'custom'
          customCommand: 'run build-prod' 
          workingDir: '$(Build.SourcesDirectory)/src/asp.web'
          verbose: true

      - task: VSBuild@1
        displayName: 'Build solution'
        inputs:
          msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactstagingdirectory)\\"'
          platform: '$(BuildPlatform)'
          configuration: '$(BuildConfiguration)'
    
      - task: PowerShell@2
        displayName: 'Download Playwright browsers'
        inputs:
          targetType: 'filePath'
          filePath: 'test/ASP.Web.FunctionalTests/bin/$(BuildConfiguration)/net8.0/playwright.ps1'
          arguments: install

      - task: VSTest@2
        displayName: 'Test Assemblies'
        inputs:
          testAssemblyVer2: |
            **\$(BuildConfiguration)\*[tT]est.dll
            **\$(BuildConfiguration)\**\*[tT]est.dll
            **\$(BuildConfiguration)\*[tT]ests.dll
            **\$(BuildConfiguration)\**\*[tT]ests.dll
            !**\obj\**
            !**\*Microsoft.TestPlatform*
            !**\*Microsoft.VisualStudio.TestPlatform*
            platform: '$(BuildPlatform)'
            configuration: '$(BuildConfiguration)'
            
      - task: DotNetCoreCLI@2
        displayName: 'dotnet restore'
        inputs:
          command: restore
          projects: src/ASP.Api/ASP.Api.csproj

      - task: DotNetCoreCLI@2
        displayName: 'dotnet build'
        inputs:
          projects: src/ASP.Api/ASP.Api.csproj
          arguments: '--configuration $(BuildConfiguration)'

      - task: DotNetCoreCLI@2
        displayName: 'dotnet publish'
        inputs:
          command: publish
          publishWebProjects: false
          projects: src/ASP.Api/ASP.Api.csproj
          arguments: '--configuration $(BuildConfiguration) -o $(build.artifactstagingdirectory)\api'
          modifyOutputPath: false
          
      - task: SpecFlowPlus@0
        inputs:
          generatorSource: 'FeatureFolder'
          projectFilePath: 'test\ASP.Web.FunctionalTests'
          projectName: 'Web'
          testExecutionJson: 'test\ASP.Web.FunctionalTests\bin\$(BuildConfiguration)\**\TestExecution.json'
          output: 'Web.html'
          
      - task: SpecFlowPlus@0
        enabled: false
        inputs:
          generatorSource: 'FeatureFolder'
          projectFilePath: 'test\ASP.Api.FunctionalTests'
          projectName: 'API'
          testExecutionJson: 'test\ASP.Api.FunctionalTests\bin\$(BuildConfiguration)\**\TestExecution.json'
          output: 'API.html'
      
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact'
        inputs:
          PathtoPublish: '$(build.artifactstagingdirectory)'
          ArtifactName: drop-web
        condition: succeededOrFailed()
        
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact'
        inputs:
          PathtoPublish: '$(build.artifactstagingdirectory)\api'
          ArtifactName: drop-api
        condition: succeededOrFailed()
          

- stage: 'DeployDev'
  displayName: 'Deploy Dev stage '
  dependsOn: 'Build'
  jobs: 
  - template: 'pipelines/deployment-stage.yml'
    parameters:
      name: 'DeployDev'
      displayName: 'Deploy Dev stage'
      dependsOn: 'Build'
      jobName: 'Deploy'
      jobDisplayName: 'Deploy Dev '
      envName: Dev
      vmImageName: $(vmImageName)
      variableFile: variables/dev-var.yml
      azureSubscriptionName: s192d.azdo-deployment
      azureSubscriptionId: '212193cd-152c-4621-97d1-85cb63f025b4'

- stage: 'DeployTest'
  displayName: 'Deploy Test stage '
  dependsOn: 'DeployDev'
  jobs: 
  - template: 'pipelines/deployment-stage.yml'
    parameters:
      name: 'DeployTest'
      displayName: 'Deploy Test stage'
      dependsOn: 'DeployDev'
      jobName: 'Deploy'
      jobDisplayName: 'Deploy Test '
      envName: Test
      vmImageName: $(vmImageName)
      variableFile: variables/test-var.yml
      azureSubscriptionName: s192t.azdo-deployment
      azureSubscriptionId: '2b154ece-99e6-497e-852d-ad69b9aecd61'